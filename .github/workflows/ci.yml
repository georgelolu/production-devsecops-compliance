name: Production DevSecOps Compliance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-security:
    name: Application Tests and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest -q

      - name: Run Ruff linting
        run: ruff check app tests

      - name: Run Bandit SAST
        run: bandit -r app -ll

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  container-security:
    name: Container Build and Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t production-devsecops-compliance:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-devsecops-compliance:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln,secret

  terraform-validation:
    name: Terraform Validation and IaC Security
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/bootstrap-state
          - infra/foundation
          - infra/terraform

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Scan Terraform with Checkov
        run: |
          python -m pip install --disable-pip-version-check checkov
          if [ "${{ matrix.directory }}" = "infra/bootstrap-state" ]; then
            # Bootstrap exceptions: private endpoint/public-network controls,
            # CMK, replication policy, and queue logging scanner compatibility.
            # Bootstrap state must remain reachable by the authorized Terraform
            # client until private endpoint and key-management migration are designed.
            checkov -d . --framework terraform --skip-check CKV_AZURE_33,CKV_AZURE_206,CKV_AZURE_36,CKV_AZURE_59,CKV2_AZURE_33,CKV2_AZURE_21,CKV2_AZURE_1 --quiet
          else
            checkov -d . --framework terraform --quiet
          fi
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Test release policy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openpolicyagent/opa:1.10.0 \
            test policies -v
